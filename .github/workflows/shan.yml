name: SH AN

on:
  workflow_dispatch:
  push:
    branches: [ shan ]
  pull_request:
    branches: [ shan ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Smoke test
        run: |
          node --check index.js
          node --check Goat.js
          node --check logger/log.js

      - name: Run bot
        run: npm start
